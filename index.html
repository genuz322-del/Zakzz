/* ---------- gerigi ---------- */
const P = (r, d) => { const t = (d - 90) * Math.PI / 180; return [500 + r * Math.cos(t), 500 + r * Math.sin(t)]; };
const f1 = n => n.toFixed(1);
const hole = r => "M" + (500 + r) + " 500A" + r + " " + r + " 0 1 0 " + (500 - r) + " 500A" + r + " " + r + " 0 1 0 " + (500 + r) + " 500Z";
function gear(N, rOut, rRoot, rHole, tr, tt) {
  const pitch = 360 / N; let d = "";
  for (let i = 0; i < N; i++) {
    const a = i * pitch, p = [P(rRoot, a - tr), P(rOut, a - tt), P(rOut, a + tt), P(rRoot, a + tr)], n = P(rRoot, a + pitch - tr);
    d += (i ? "L" : "M") + p.map(q => f1(q[0]) + " " + f1(q[1])).join("L") + "A" + rRoot + " " + rRoot + " 0 0 1 " + f1(n[0]) + " " + f1(n[1]);
  }
  return d + "Z" + hole(rHole);
}
const GEAR2 = '<defs><radialGradient id="g2" cx=".5" cy=".5" r=".5"><stop offset=".78" class="k4"/><stop offset=".9" class="k3"/><stop offset="1" class="k1"/></radialGradient></defs>' +
 '<path fill-rule="evenodd" d="' + gear(24, 418, 402, 378, 4.6, 3) + '" fill="url(#g2)" stroke="var(--cl)" stroke-opacity=".75" stroke-width="1.6" stroke-linejoin="round"/>';
let tk = ""; for (let i = 0; i < 72; i++) { const b = i % 6 === 0, a = P(366, i * 5), c = P(b ? 352 : 359, i * 5); tk += '<line x1="' + f1(a[0]) + '" y1="' + f1(a[1]) + '" x2="' + f1(c[0]) + '" y2="' + f1(c[1]) + '" stroke="var(--cl)" stroke-width="' + (b ? 3 : 1.4) + '" opacity="' + (b ? .9 : .45) + '" stroke-linecap="round"/>'; }
const BODY = '<defs><radialGradient id="bd" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#01040b"/><stop offset=".85" class="k4"/><stop offset="1" class="k3"/></radialGradient></defs>' +
 '<circle cx="500" cy="500" r="376" fill="url(#bd)"/><circle cx="500" cy="500" r="376" fill="none" stroke="var(--c1)" stroke-opacity=".7" stroke-width="2.5"/><circle cx="500" cy="500" r="304" fill="none" stroke="var(--c1)" stroke-opacity=".55" stroke-width="2"/>' + tk;
const NAME = '<defs><path id="nm" d="M144 500A356 356 0 0 0 856 500"/></defs><text class="nm glow"><textPath href="#nm" startOffset="50%" text-anchor="middle">ZAKZZ</textPath></text><text class="nm"><textPath href="#nm" startOffset="50%" text-anchor="middle">ZAKZZ</textPath></text>';

const CSS = `

R.style.setProperty("--dock-b", IS_GGMP ? "64px" : "12px");
const hs = document.createElement("style");
hs.textContent = IS_GGMP ? "html.hx-lite .dashboard{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(0,10,30,.58)!important}html.hx-lite .dashboard::after{animation:none!important}html.hx-lite .bg-container{animation:none!important}html.hx-lite .bg-particles{display:none!important}" : "html,body{margin:0;background:transparent;overflow:hidden}";
document.head.appendChild(hs);
if (IS_GGMP) document.documentElement.classList.add("hx-lite");

/* ---------- warna ---------- */
const PRESETS = [["Biru neon", "#2b8cff"], ["Biru langit", "#4dc3ff"], ["Biru tua", "#2459e8"], ["Tosca", "#14e0d0"], ["Ungu", "#8a5cff"], ["Merah", "#ff4a5a"], ["Emas", "#e0b24a"], ["Putih", "#eaf4ff"]];
let main = "#2b8cff";
try { const v = localStorage.getItem("hxV1"); if (/^#[0-9a-f]{6}$/i.test(v)) main = v; } catch (e) {}
const hexHue = h => { const r = parseInt(h.slice(1, 3), 16) / 255, g = parseInt(h.slice(3, 5), 16) / 255, b = parseInt(h.slice(5, 7), 16) / 255, m = Math.max(r, g, b), d = m - Math.min(r, g, b); if (!d) return 0; const x = m === r ? (g - b) / d + (g < b ? 6 : 0) : m === g ? (b - r) / d + 2 : (r - g) / d + 4; return Math.round(x * 60); };
const hueHex = h => { const k = n => (n + h / 30) % 12, f = n => .5 - .5 * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))), x = v => Math.round(v * 255).toString(16).padStart(2, "0"); return "#" + x(f(0)) + x(f(8)) + x(f(4)); };
$("cols").innerHTML = PRESETS.map(p => '<button data-c="' + p[1] + '" style="background:' + p[1] + '" aria-label="' + p[0] + '"></button>').join("");
function setColor(c) {
  main = c; try { localStorage.setItem("hxV1", c); } catch (e) {}
  R.style.setProperty("--c1", c);
  sr.querySelectorAll("[data-c]").forEach(b => b.classList.toggle("on", b.dataset.c.toLowerCase() === c.toLowerCase()));
  const h = hexHue(c); if (+$("hue").value !== h) $("hue").value = h;
  if ($("pick").value.toLowerCase() !== c.toLowerCase()) $("pick").value = c;
}
$("cols").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) setColor(b.dataset.c); });
$("hue").addEventListener("input", e => setColor(hueHex(+e.target.value)));
$("pick").addEventListener("input", e => setColor(e.target.value));
$("fab").addEventListener("click", () => $("panel").classList.toggle("open"));
$("x").addEventListener("click", () => $("panel").classList.remove("open"));
setColor(main);

/* ---------- masuk: layer bergantian, hanya transform dan opacity ---------- */
let liveT;
function showHUD() {
  clearTimeout(liveT); R.classList.remove("pre", "hid", "live", "settled", "go"); void R.offsetWidth; R.classList.add("go");
  liveT = setTimeout(() => { R.classList.add("live"); liveT = setTimeout(() => R.classList.add("settled"), 700); }, 900);
}
const ready = cb => requestAnimationFrame(() => cb());
(() => {
  const dash = document.getElementById("dashboard-container"); if (!dash) { ready(showHUD); return; }
  let n = 0; const t = setInterval(() => { n++; const ok = dash.classList.contains("show-dashboard"); if (ok || n > 160) { clearInterval(t); ready(showHUD); } }, 60);
})();

/* ---------- jeda animasi saat halaman di-scroll ---------- */
let scT; const onScr = () => { R.classList.add("scrolling"); clearTimeout(scT); scT = setTimeout(() => R.classList.remove("scrolling"), 220); };
window.addEventListener("scroll", onScr, {capture: true, passive: true});
window.addEventListener("wheel", onScr, {capture: true, passive: true});
window.addEventListener("touchmove", onScr, {capture: true, passive: true});
})();
</script>
</body>
